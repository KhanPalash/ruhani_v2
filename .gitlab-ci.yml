# GitLab CI equivalent of .github/workflows/build-apk.yml

image: mingc/android-build-box:latest

stages:
  - test
  - lint
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# Shared rules: run on MRs, the default branch, and manual web pipelines.
.default_rules: &default_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "web"

# Shared setup: provide .env, a debug keystore, and an executable wrapper.
.android_setup:
  before_script:
    - if [ ! -f .env ]; then cp .env.example .env; fi
    - |
      if [ ! -f debug.keystore ]; then
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      fi
    - chmod +x ./gradlew

unit_tests:
  extends: .android_setup
  stage: test
  timeout: 20 minutes
  rules: *default_rules
  script:
    - ./gradlew testDebugUnitTest --stacktrace
  artifacts:
    name: ruhani-v2-unit-test-results
    paths:
      - app/build/reports/tests/
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml
    expire_in: 14 days
    when: always

lint:
  extends: .android_setup
  stage: lint
  timeout: 20 minutes
  rules: *default_rules
  script:
    - ./gradlew lintDebug --stacktrace
  artifacts:
    name: ruhani-v2-lint-results
    paths:
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml
    expire_in: 14 days
    when: always

build_debug_apk:
  extends: .android_setup
  stage: build
  timeout: 25 minutes
  rules: *default_rules
  script:
    - ./gradlew assembleDebug --stacktrace
    - echo "Built APK files:"
    - ls -la app/build/outputs/apk/debug/
  artifacts:
    name: ruhani-v2-debug-apk
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 14 days
    when: on_success
